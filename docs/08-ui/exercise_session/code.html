<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden antialiased">
<!-- Top Navigation Placeholder (suppressed for focused session, but providing a back button) -->
<header class="w-full top-0 sticky bg-surface px-lg py-sm flex justify-between items-center h-16 z-10 shadow-[0_4px_16px_rgba(67,100,68,0.03)]">
<button aria-label="End Session" class="flex items-center justify-center w-12 h-12 text-primary hover:bg-surface-container-low transition-colors rounded-full active:scale-95 duration-150 ease-in-out">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary tracking-tight">REVIA</span>
<div class="w-12 h-12"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-lg py-3xl w-full max-w-md mx-auto relative h-[calc(100vh-64px)] overflow-y-auto">
<!-- Video/Animation Background Area (Soft representation of the exercise) -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none flex items-center justify-center overflow-hidden">
<div class="bg-cover bg-center w-full h-full" data-alt="A soft, abstract, blurred out light green and cream pastel background. The image should be incredibly minimalist, evoking a sense of calm and serenity, like soft sunlight filtering through leaves. It serves as a non-distracting backdrop for a rehabilitation app interface." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAJe1VdgigxUNuxSZfDsQy4P6B7M44CITrZgAA77yTxv1tlf-kx_qltSQ-a73lY2WbL2fp5OwJcdqHxQKPDuyRrKr0rCYuu4ZRHE-mjK_FqQs7YKmUsntSn9y9GTKzmDU_blO5Mr5C-D9XVpxp7SNylZkX8jlzfGJ3Z1scr5JSNKOlCriM_uRiorceO62EjWDYGxhVzrLGu2rrDh69o36muk7-Ocema_f_y34I2pBXAI9uQNJ31iNl-Ew')"></div>
<!-- Optional subtle gradient overlay -->
<div class="absolute inset-0 bg-gradient-to-b from-background via-transparent to-background"></div>
</div>
<div class="z-10 flex flex-col items-center w-full space-y-2xl">
<!-- Headline -->
<h1 class="font-display text-display text-primary text-center">SIT TO STAND</h1>
<!-- Rep Counter & Progress -->
<div class="flex flex-col items-center space-y-md">
<div class="flex items-baseline space-x-2">
<span class="font-display text-[64px] leading-none text-primary font-bold">5</span>
<span class="font-headline-lg text-headline-lg text-outline">/ 8</span>
</div>
<div class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Reps Completed</div>
<!-- Progress Dots -->
<div aria-label="Progress: 5 out of 8 reps completed" class="flex space-x-3 mt-4">
<div class="w-4 h-4 rounded-full bg-primary shadow-sm"></div>
<div class="w-4 h-4 rounded-full bg-primary shadow-sm"></div>
<div class="w-4 h-4 rounded-full bg-primary shadow-sm"></div>
<div class="w-4 h-4 rounded-full bg-primary shadow-sm"></div>
<div class="w-4 h-4 rounded-full bg-primary shadow-sm"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline-variant"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline-variant"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline-variant"></div>
</div>
</div>
<!-- Timer Area -->
<div class="bg-surface p-xl rounded-[24px] shadow-[0_8px_32px_rgba(67,100,68,0.08)] flex flex-col items-center justify-center min-w-[200px] mt-xl">
<span class="material-symbols-outlined text-primary mb-2 text-3xl" style="font-variation-settings: 'FILL' 0;">timer</span>
<div class="font-display text-display text-textPrimary">00:42</div>
</div>
<!-- Primary Action: Pause -->
<button class="w-full max-w-[280px] h-[72px] bg-primary text-on-primary rounded-[16px] flex items-center justify-center space-x-md shadow-lg active:scale-95 transition-transform duration-200 mt-2xl hover:bg-surface-tint">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">pause</span>
<span class="font-title-lg text-title-lg">Pause Session</span>
</button>
<!-- Feedback Prompt (Docked towards bottom) -->
<div class="w-full bg-surfaceVariant p-lg rounded-[20px] mt-auto">
<p class="font-title-lg text-title-lg text-center text-textPrimary mb-lg">How does this feel?</p>
<div class="flex justify-between space-x-sm">
<button class="flex-1 bg-surface py-md rounded-lg flex flex-col items-center justify-center hover:bg-surface-container-low transition-colors shadow-sm active:scale-95">
<span class="text-3xl mb-1">🙂</span>
<span class="font-label-md text-label-md text-textSecondary">Comfortable</span>
</button>
<button class="flex-1 bg-surface py-md rounded-lg flex flex-col items-center justify-center hover:bg-surface-container-low transition-colors shadow-sm active:scale-95 border-2 border-transparent focus:border-primary">
<span class="text-3xl mb-1">😐</span>
<span class="font-label-md text-label-md text-textSecondary">Challenging</span>
</button>
<button class="flex-1 bg-surface py-md rounded-lg flex flex-col items-center justify-center hover:bg-surface-container-low transition-colors shadow-sm active:scale-95 border-2 border-transparent focus:border-primary">
<span class="text-3xl mb-1">🥵</span>
<span class="font-label-md text-label-md text-textSecondary">Difficult</span>
</button>
</div>
</div>
</div>
</main>
