<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Onboarding - Goals Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            font-weight: normal;

            line-height: 1;

            text-transform: none;

            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;

        }

<script id="tailwind-config">

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#c6edc4",
                        "outline": "#737970",
                        "surface-variant": "#e6e2dc",
                        "info": "#5B8FB9",
                        "surface-container": "#f1ede7",
                        "surface": "#fdf9f3",
                        "surface-container-high": "#ebe8e2",
                        "tertiary-container": "#9a6674",
                        "surface-container-low": "#f7f3ed",
                        "secondary-fixed-dim": "#ffb596",
                        "secondary-fixed": "#ffdbcd",
                        "surface-bright": "#fdf9f3",
                        "on-tertiary-fixed": "#330f1c",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#673947",
                        "warning": "#D99100",
                        "on-primary": "#ffffff",
                        "outline-variant": "#c2c8be",
                        "success": "#4A7C59",
                        "on-error-container": "#93000a",
                        "textPrimary": "#2D2A26",
                        "surfaceVariant": "#F2E8DA",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-container": "#f7fff2",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#2e4e30",
                        "error": "#C0564B",
                        "secondary": "#8c4e33",
                        "on-secondary-fixed-variant": "#6f371e",
                        "primaryContainer": "#E1EADF",
                        "on-background": "#1c1c18",
                        "on-tertiary-container": "#fffbff",
                        "inverse-on-surface": "#f4f0ea",
                        "secondary-container": "#feae8c",
                        "tertiary": "#7f4e5c",
                        "error-container": "#ffdad6",
                        "textSecondary": "#66615C",
                        "surface-dim": "#dddad4",
                        "surface-container-highest": "#e6e2dc",
                        "surface-tint": "#456646",
                        "on-error": "#ffffff",
                        "inverse-surface": "#31302d",
                        "on-primary-fixed": "#012108",
                        "on-surface": "#1c1c18",
                        "on-secondary-fixed": "#360f00",
                        "inverse-primary": "#abd0a9",
                        "primary-fixed-dim": "#abd0a9",
                        "background": "#fdf9f3",
                        "on-secondary-container": "#793f25",
                        "primary": "#436444",
                        "on-surface-variant": "#424841",
                        "tertiary-fixed": "#ffd9e1",
                        "tertiary-fixed-dim": "#f4b6c6",
                        "primary-container": "#5b7d5b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "2xl": "32px",
                        "sm": "8px",
                        "md": "12px",
                        "lg": "16px",
                        "3xl": "48px",
                        "xl": "24px",
                        "4xl": "64px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "display": ["Atkinson Hyperlegible Next"],
                        "body-lg": ["Atkinson Hyperlegible Next"],
                        "body-md": ["Atkinson Hyperlegible Next"],
                        "headline-lg": ["Atkinson Hyperlegible Next"],
                        "caption": ["Atkinson Hyperlegible Next"],
                        "title-lg": ["Atkinson Hyperlegible Next"],
                        "headline-lg-mobile": ["Atkinson Hyperlegible Next"],
                        "label-md": ["Atkinson Hyperlegible Next"]
                    },
                    "fontSize": {
                        "display": ["44px", { "lineHeight": "52px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],

                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-full flex flex-col antialiased">
<!-- Top App Bar - Simplified for Onboarding/Transactional -->
<header class="w-full top-0 sticky bg-background flex justify-between items-center px-lg py-md z-40">
<button aria-label="Go back" class="flex items-center justify-center w-12 h-12 rounded-full text-primary hover:bg-surface-container-low transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex-1 flex justify-center">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">REVIA</span>
</div>
<div class="w-12 h-12"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-lg pt-2xl pb-4xl max-w-md mx-auto w-full">
<!-- Header Section -->
<div class="mb-2xl text-center">
<p class="font-label-md text-label-md text-primary mb-sm uppercase tracking-widest">Step 2 of 4</p>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-md">What would you like to improve?</h1>
<p class="font-body-md text-body-md text-textSecondary">Select all that apply to help us personalize your journey.</p>
</div>
<!-- Goals Selection Grid -->
<div class="grid grid-cols-2 gap-md mb-3xl flex-1 content-start" id="goals-grid">
<!-- Goal Card: Movement -->
<button aria-pressed="false" class="goal-card flex flex-col items-center justify-center p-xl rounded-xl bg-surface border-2 border-transparent shadow-[0_4px_16px_rgba(67,100,68,0.08)] hover:shadow-[0_8px_24px_rgba(67,100,68,0.12)] transition-all duration-200 active:scale-95 group text-center min-h-[140px]" onclick="toggleCard(this)">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center mb-md group-[.selected]:bg-primary group-[.selected]:text-on-primary transition-colors text-primary">
<span class="material-symbols-outlined" data-icon="directions_walk">directions_walk</span>
</div>
<span class="font-title-lg text-title-lg text-on-surface group-[.selected]:text-primary transition-colors">Movement</span>
</button>
<!-- Goal Card: Strength -->
<button aria-pressed="false" class="goal-card flex flex-col items-center justify-center p-xl rounded-xl bg-surface border-2 border-transparent shadow-[0_4px_16px_rgba(67,100,68,0.08)] hover:shadow-[0_8px_24px_rgba(67,100,68,0.12)] transition-all duration-200 active:scale-95 group text-center min-h-[140px]" onclick="toggleCard(this)">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center mb-md group-[.selected]:bg-primary group-[.selected]:text-on-primary transition-colors text-primary">
<span class="material-symbols-outlined" data-icon="fitness_center">fitness_center</span>
</div>
<span class="font-title-lg text-title-lg text-on-surface group-[.selected]:text-primary transition-colors">Strength</span>
</button>
<!-- Goal Card: Stamina -->
<button aria-pressed="false" class="goal-card flex flex-col items-center justify-center p-xl rounded-xl bg-surface border-2 border-transparent shadow-[0_4px_16px_rgba(67,100,68,0.08)] hover:shadow-[0_8px_24px_rgba(67,100,68,0.12)] transition-all duration-200 active:scale-95 group text-center min-h-[140px]" onclick="toggleCard(this)">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center mb-md group-[.selected]:bg-primary group-[.selected]:text-on-primary transition-colors text-primary">
<span class="material-symbols-outlined" data-icon="monitor_heart">monitor_heart</span>
</div>
<span class="font-title-lg text-title-lg text-on-surface group-[.selected]:text-primary transition-colors">Stamina</span>
</button>
<!-- Goal Card: Independence -->
<button aria-pressed="false" class="goal-card flex flex-col items-center justify-center p-xl rounded-xl bg-surface border-2 border-transparent shadow-[0_4px_16px_rgba(67,100,68,0.08)] hover:shadow-[0_8px_24px_rgba(67,100,68,0.12)] transition-all duration-200 active:scale-95 group text-center min-h-[140px]" onclick="toggleCard(this)">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center mb-md group-[.selected]:bg-primary group-[.selected]:text-on-primary transition-colors text-primary">
<span class="material-symbols-outlined" data-icon="home_max">home_max</span>
</div>
<span class="font-title-lg text-title-lg text-on-surface group-[.selected]:text-primary transition-colors">Independence</span>
</button>
<!-- Goal Card: Daily activities -->
<button aria-pressed="false" class="goal-card flex flex-col items-center justify-center p-xl rounded-xl bg-surface border-2 border-transparent shadow-[0_4px_16px_rgba(67,100,68,0.08)] hover:shadow-[0_8px_24px_rgba(67,100,68,0.12)] transition-all duration-200 active:scale-95 group text-center min-h-[140px]" onclick="toggleCard(this)">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center mb-md group-[.selected]:bg-primary group-[.selected]:text-on-primary transition-colors text-primary">
<span class="material-symbols-outlined" data-icon="coffee">coffee</span>
</div>
<span class="font-title-lg text-title-lg text-on-surface group-[.selected]:text-primary transition-colors">Daily tasks</span>
</button>
<!-- Goal Card: Overall wellbeing -->
<button aria-pressed="false" class="goal-card flex flex-col items-center justify-center p-xl rounded-xl bg-surface border-2 border-transparent shadow-[0_4px_16px_rgba(67,100,68,0.08)] hover:shadow-[0_8px_24px_rgba(67,100,68,0.12)] transition-all duration-200 active:scale-95 group text-center min-h-[140px]" onclick="toggleCard(this)">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center mb-md group-[.selected]:bg-primary group-[.selected]:text-on-primary transition-colors text-primary">
<span class="material-symbols-outlined" data-icon="spa">spa</span>
</div>
<span class="font-title-lg text-title-lg text-on-surface group-[.selected]:text-primary transition-colors">Wellbeing</span>
</button>
</div>
</main>
<!-- Sticky Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-background px-lg py-xl pb-3xl z-50 shadow-[0_-4px_24px_rgba(67,100,68,0.05)]">
<div class="max-w-md mx-auto">
<button class="w-full bg-surface-dim text-textSecondary font-title-lg text-title-lg py-md rounded-[12px] min-h-[48px] transition-colors duration-300 flex items-center justify-center gap-sm disabled:opacity-50" disabled="" id="next-btn">
<span>Continue</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
<script>
        function toggleCard(card) {
            const isSelected = card.classList.contains('selected');
            
            if (isSelected) {
                card.classList.remove('selected', 'border-primary', 'bg-primary-fixed');
                card.classList.add('bg-surface', 'border-transparent');
                card.setAttribute('aria-pressed', 'false');
            } else {
                card.classList.add('selected', 'border-primary', 'bg-primary-fixed');
                card.classList.remove('bg-surface', 'border-transparent');
                card.setAttribute('aria-pressed', 'true');
            }

            checkSelection();
        }

        function checkSelection() {
            const selectedCards = document.querySelectorAll('.goal-card.selected');
            const nextBtn = document.getElementById('next-btn');
            
            if (selectedCards.length > 0) {
                nextBtn.classList.remove('bg-surface-dim', 'text-textSecondary');
                nextBtn.classList.add('bg-primary', 'text-on-primary');
                nextBtn.removeAttribute('disabled');
            } else {
                nextBtn.classList.add('bg-surface-dim', 'text-textSecondary');
                nextBtn.classList.remove('bg-primary', 'text-on-primary');
                nextBtn.setAttribute('disabled', 'true');
            }
        }
    </script>
</body></html>
