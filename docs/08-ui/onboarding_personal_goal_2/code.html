<body class="bg-background text-on-background font-body-md h-full flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<header class="w-full top-0 sticky bg-background flex justify-between items-center px-lg py-md z-40">
<button aria-label="Go back" class="flex items-center justify-center w-12 h-12 rounded-full text-primary hover:bg-surface-container-low transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight font-bold">NIRVAN</span>
<div class="w-12 h-12"></div>
</header>
<main class="flex-grow flex flex-col px-lg pt-2xl pb-4xl max-w-2xl mx-auto w-full">
<div class="flex flex-col gap-sm mb-3xl">
<h1 class="font-display text-display text-textPrimary leading-tight">What matters most to you?</h1>
<p class="font-body-lg text-body-lg text-textSecondary mt-sm">
                Sharing your main goal helps us personalize your recovery journey, focusing on what brings you the most joy and independence.
            </p>
</div>
<form class="flex-grow flex flex-col justify-between h-full relative z-10" id="goalForm">
<div class="flex flex-col gap-lg bg-surface p-xl rounded-xl shadow-[0_4px_24px_rgba(67,100,68,0.06)] border border-surface-variant">
<label class="font-title-lg text-title-lg text-primary flex items-center gap-sm" for="personalGoal">
<span class="material-symbols-outlined text-primary" data-icon="edit_note">edit_note</span>
                    I want to...
                </label>
<textarea aria-label="Enter your personal goal" class="w-full rounded-lg border-2 border-surface-variant bg-surface-container-lowest p-md font-body-lg text-body-lg text-textPrimary focus:border-primary focus:ring-0 focus:outline-none transition-colors placeholder:text-textSecondary/50 resize-none shadow-sm" id="personalGoal" name="personalGoal" placeholder="e.g., I want to walk independently" rows="4"></textarea>
</div>
<div class="mt-auto pt-4xl pb-xl">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-md px-xl rounded-xl flex items-center justify-center gap-sm hover:bg-primary-container hover:text-on-primary-container transition-all active:scale-[0.98] shadow-sm disabled:opacity-50 disabled:cursor-not-allowed h-12" id="continueBtn" type="submit">
                    Continue
                    <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-30 mix-blend-multiply">
<div class="absolute -top-[20%] -right-[10%] w-[70vw] h-[70vw] rounded-full bg-primary-fixed blur-3xl opacity-20"></div>
<div class="absolute bottom-[10%] -left-[20%] w-[80vw] h-[80vw] rounded-full bg-secondary-fixed blur-3xl opacity-20"></div>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('goalForm');
            const textarea = document.getElementById('personalGoal');
            const btn = document.getElementById('continueBtn');

            const checkInput = () => {
                if(textarea.value.trim().length > 0) {
                     btn.classList.add('bg-primary', 'text-on-primary', 'hover:bg-primary/90');
                     btn.classList.remove('bg-surface-variant', 'text-outline');
                } else {
                    btn.classList.add('bg-primary', 'text-on-primary');
                }
            };

            textarea.addEventListener('input', checkInput);

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                btn.innerHTML = `<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Saving...`;
                btn.classList.add('opacity-80', 'cursor-wait');
                
                setTimeout(() => {
                    btn.innerHTML = `Saved <span class="material-symbols-outlined" data-icon="check">check</span>`;
                    btn.classList.replace('bg-primary', 'bg-success');
                    btn.classList.replace('hover:bg-primary-container', 'hover:bg-success');
                    btn.classList.replace('hover:text-on-primary-container', 'hover:text-on-primary');
                    
                    setTimeout(() => {
                        window.location.href = '#'; 
                    }, 800);
                }, 1000);
            });
            
            textarea.focus();
        });
    </script>
