<style>
        .splash-gradient {
            background: linear-gradient(135deg, theme('colors.surface') 0%, theme('colors.primaryContainer') 100%);
        }
        
        .fade-in-up {
            animation: fadeInUp 1s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pulse-slow {
            animation: pulseSlow 3s ease-in-out infinite;
        }

        @keyframes pulseSlow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .loading-dot {
            animation: loadingDots 1.4s infinite ease-in-out both;
        }

        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes loadingDots {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col splash-gradient selection:bg-primary-container selection:text-on-primary-container">
<main class="flex-grow flex flex-col items-center justify-center relative overflow-hidden px-lg">
<!-- Ambient Background Elements -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-primary-fixed opacity-30 blur-3xl pulse-slow mix-blend-multiply"></div>
<div class="absolute -bottom-[20%] -right-[10%] w-[60%] h-[60%] rounded-full bg-secondary-fixed opacity-30 blur-3xl pulse-slow mix-blend-multiply" style="animation-delay: 1.5s;"></div>
</div>
<!-- Central Content -->
<div class="z-10 flex flex-col items-center justify-center text-center fade-in-up">
<!-- Logo Icon / Mark -->
<div class="w-3xl h-3xl mb-lg rounded-full bg-primary-container text-primary flex items-center justify-center shadow-lg shadow-primary-container/20">
<span class="material-symbols-outlined !text-display" style="font-variation-settings: 'FILL' 1;">vital_signs</span>
</div>
<!-- Brand Name -->
<h1 class="font-display text-display text-primary tracking-tight mb-sm">
                NIRVAN
            </h1>
<!-- Tagline -->
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs mx-auto">
                Move Forward. Live Better.
            </p>
</div>
<!-- Loading Indicator -->
<div class="absolute bottom-4xl left-0 right-0 flex justify-center items-center gap-2 fade-in-up" style="animation-delay: 0.5s;">
<div class="w-2 h-2 rounded-full bg-primary loading-dot"></div>
<div class="w-2 h-2 rounded-full bg-primary loading-dot"></div>
<div class="w-2 h-2 rounded-full bg-primary loading-dot"></div>
</div>
</main>
<script>
        // Simulate loading process then transition
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                // In a real app, this would route to the Home/Dashboard
                // For this splash screen demo, we'll just add a brief visual transition
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity 0.5s ease-out';
            }, 3000);
        });
    </script>
</body></html>
